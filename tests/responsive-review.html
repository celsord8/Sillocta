<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>Sillocta · revisão responsiva</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171717;color:#eee;font:14px/1.5 system-ui,sans-serif}header{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:12px 20px;background:#242424;border-bottom:1px solid #555}label{display:flex;gap:8px;align-items:center}select{font:inherit;padding:6px;background:#171717;color:#eee;border:1px solid #777;border-radius:4px}main{width:max-content;min-width:100%;padding:20px}iframe{display:block;width:390px;height:844px;margin:auto;border:1px solid #666;background:#050404}
</style>
<header><strong>Revisão responsiva · prévia</strong><label for="viewport">Largura<select id="viewport"><option value="320">320 px</option><option value="360">360 px</option><option value="390" selected>390 px</option><option value="430">430 px</option><option value="768">768 px</option><option value="1440">1440 px</option><option value="1920">1920 px</option></select></label><label for="page">Página<select id="page"><option value="/">Home</option><option value="/perfume/creed-aventus">Perfume masculino</option><option value="/perfume/dior-miss-dior">Perfume feminino</option></select></label><span>Teste a sacola e o checkout dentro da página.</span></header>
<main><iframe id="shop-review" src="/" title="Sillocta na largura selecionada"></iframe></main>
<script>
const frame=document.getElementById('shop-review');
document.getElementById('viewport').addEventListener('change',event=>frame.style.width=event.target.value+'px');
document.getElementById('page').addEventListener('change',event=>frame.src=event.target.value);
</script>
</html>
